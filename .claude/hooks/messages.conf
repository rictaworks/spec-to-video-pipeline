# フックが出力する文言。スクリプト本体から文字列を分離する。
MSG_NOT_A_REPO="Git リポジトリの外で実行された。リポジトリ内で実行すること。"
MSG_NO_STAGED="ステージされた変更が無い。git add でステージしてからコミットすること。"
MSG_SECURITY_REQUIRED="コミット前のセキュリティレビューが未実施。
1. /security-review を実行し、指摘を解消する（基準: .claude/OWASP10.md）
2. 解消後に次を実行して記録する:
   bash .claude/hooks/record-review.sh security
3. 再度コミットする
ステージ内容を変更した場合は記録が無効になるため、1 からやり直すこと。"
MSG_PR_NUMBER_REQUIRED="PR 番号を明示して実行すること（例: gh pr merge 12 --squash）。番号なしのマージは許可しない。"
MSG_GH_FAILED="gh コマンドで PR 情報を取得できなかった。gh auth status を確認すること。判定不能のためマージを中止する。"
MSG_REF_REQUIRED="マージ元のブランチ・コミットを明示して実行すること。"
MSG_REF_UNRESOLVED="マージ元の参照を解決できなかった。判定不能のためマージを中止する。"
MSG_MERGE_REVIEW_REQUIRED="マージ前レビューが未完了。次を実施してから再実行すること。
1. reviewer サブエージェントでレビューし、記録する:
   bash .claude/hooks/record-review.sh reviewer <対象>
2. pr-checker サブエージェントで確認し、記録する:
   bash .claude/hooks/record-review.sh pr-checker <対象>
対象のコミットが進んだ場合は記録が無効になるため、1 からやり直すこと。"
MSG_RECORD_USAGE="使い方: record-review.sh security | reviewer <PR番号またはref> | pr-checker <PR番号またはref>"
