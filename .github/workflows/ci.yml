name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: 依存関係を導入します
        run: npm ci
      - name: テストを実行します
        run: timeout 300 npm test
      - name: 型検査を実行します
        run: timeout 120 npm run typecheck
      - name: 配布物を組み立てられることを確認します
        run: timeout 120 node scripts/build-skill-package.js 01.01.00
